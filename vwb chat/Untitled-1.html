<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatter — Zamonaviy Web Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f3f6f9;
            --bg-panel: #ffffff;
            --primary: #0f768a;
            --primary-light: #e6f3f5;
            --primary-hover: #0c6172;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --msg-in: #f1f5f9;
            --msg-out: #e3f2f4;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            padding: 14px;
            gap: 14px;
            overflow: hidden;
        }

        /* 1. CHAP SIDEBAR (MENYU) */
        .sidebar-left {
            width: 240px;
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-left: 4px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: var(--primary);
            color: white;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .user-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1e40af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .avatar.teal {
            background: var(--primary-light);
            color: var(--primary);
        }

        .user-info h4 {
            font-size: 14px;
            font-weight: 600;
        }

        .user-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
        }

        .nav-item:hover {
            background: #f1f5f9;
            color: var(--text-dark);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #e2e8f0;
        }

        .version-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 2. O'RTA PANEL (CHATLAR RO'YXATI) */
        .chat-list-panel {
            width: 320px;
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .add-chat-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            transition: 0.2s;
        }

        .add-chat-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* QIDIRUV QATORI VA X TUGMASI */
        .search-wrapper {
            position: relative;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        .search-box {
            width: 100%;
            padding: 10px 36px 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
            background: white;
        }

        .clear-search-btn {
            position: absolute;
            right: 10px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #e2e8f0;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .clear-search-btn:hover {
            background: #cbd5e1;
            color: var(--text-dark);
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: #b8dfe6;
            font-weight: 600;
        }

        .chats-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .chat-item:hover {
            background: #f8fafc;
        }

        .chat-item.active {
            background: var(--primary-light);
        }

        .chat-item-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item-last {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 40px;
        }

        /* 3. O'NG PANEL (ASOSIY CHAT OYNASI) */
        .chat-window {
            flex: 1;
            background: var(--bg-panel);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* BOSILADIGAN SARLAVHA */
        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 12px 6px 6px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .chat-header-user:hover {
            background: #f1f5f9;
        }

        .chat-header-user h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-user p {
            font-size: 12px;
            color: #10b981;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        /* XABARLAR MAYDONI */
        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fcfdfe;
        }

        .date-divider {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin: 8px 0;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: var(--msg-in);
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background: var(--msg-out);
            color: var(--text-dark);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .message-media img, .message-media video {
            max-width: 100%;
            max-height: 260px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: block;
        }

        .message-media audio {
            width: 240px;
            height: 36px;
            margin-bottom: 6px;
        }

        .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.7);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.08);
            margin-bottom: 6px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 13px;
        }

        /* PASTKI XABAR YOZISH PANELI */
        .chat-input-wrapper {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-panel);
        }

        .media-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .media-btn {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-dark);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .media-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .message-input:focus {
            border-color: var(--primary);
            background: white;
        }

        .send-btn {
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .disclaimer {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* MODAL OYNALAR */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 24px;
            border-radius: 18px;
            width: 370px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 17px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-secondary {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
        }

        .btn-primary {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        /* TELEGRAM USLUBIDAGI PROFIL VA GURUH MA'LUMOTLARI OYNASI */
        .info-modal-box {
            background: white;
            border-radius: 20px;
            width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.18);
            position: relative;
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .info-modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: white;
            z-index: 5;
        }

        .info-modal-header span {
            font-weight: 600;
            font-size: 15px;
        }

        .close-info-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-info-btn:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        .info-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 16px;
            text-align: center;
        }

        .info-big-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f768a, #14b8a6);
            color: white;
            font-size: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 6px 16px rgba(15, 118, 138, 0.25);
        }

        .info-hero h2 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .info-hero p {
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
        }

        .info-quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px 18px;
            border-bottom: 8px solid #f1f5f9;
        }

        .quick-action-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .quick-action-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .quick-action-btn span.icon {
            font-size: 18px;
        }

        .info-details-section {
            padding: 14px 20px;
            border-bottom: 8px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .detail-icon {
            font-size: 18px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .detail-content h5 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .detail-content span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .info-stats-section {
            padding: 14px 20px;
            border-bottom: 8px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .stat-item span.icon {
            font-size: 17px;
            width: 22px;
            text-align: center;
        }

        .members-section {
            padding: 14px 20px 20px;
        }

        .members-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .member-search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 12px;
            margin-bottom: 12px;
            outline: none;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e2e8f0;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info h6 {
            font-size: 13px;
            font-weight: 600;
        }

        .member-info small {
            font-size: 11px;
            color: var(--text-muted);
        }

        .member-info small.online {
            color: #10b981;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .sidebar-left { width: 75px; padding: 16px 10px; align-items: center; }
            .brand-name, .user-info, .nav-item span, .version-text { display: none; }
            .chat-list-panel { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- 1. CHAP SIDEBAR -->
    <aside class="sidebar-left">
        <div>
            <div class="brand">
                <div class="brand-logo">C</div>
                <div class="brand-name">Chatter</div>
            </div>

            <div class="user-card">
                <div class="avatar" id="currentUserAvatar">P</div>
                <div class="user-info">
                    <h4 id="currentUserName">Pokiza</h4>
                    <span id="currentUserHandle">@poki</span>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="nav-item active" onclick="setNavMenu(this, 'all')">
                    💬 <span>Xabarlar</span>
                </button>
                <button class="nav-item" onclick="setNavMenu(this, 'contacts')">
                    👤 <span>Kontaktlar</span>
                </button>
                <button class="nav-item" onclick="openProfileModal()">
                    ⚙️ <span>Sozlamalar</span>
                </button>
                <button class="nav-item" onclick="setNavMenu(this, 'secret')">
                    🔒 <span>Maxfiy chatlar</span>
                </button>
            </nav>
        </div>

        <div class="sidebar-footer">
            <button class="login-btn" onclick="openProfileModal()">→ Hisobga kirish</button>
            <div class="version-text">Chatter • Pro Versiya</div>
        </div>
    </aside>

    <!-- 2. CHATLAR RO'YXATI -->
    <section class="chat-list-panel">
        <div class="panel-header">
            <h2>Chatlar</h2>
            <button class="add-chat-btn" title="Yangi chat" onclick="openNewChatModal()">+</button>
        </div>

        <!-- QIDIRUV VA TOZALASH TUGMASI (X) -->
        <div class="search-wrapper">
            <input type="text" class="search-box" id="searchInput" placeholder="Chat yoki foydalanuvchini qidirish..." oninput="handleSearchInput()">
            <button class="clear-search-btn" id="clearSearchBtn" title="Qidiruvni tozalash" onclick="clearSearch()">✕</button>

        function renderChatList() {
            const container = document.getElementById('chatsContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filteredChats = chats.filter(chat => {
                const matchesSearch = chat.name.toLowerCase().includes(searchQuery);
                if (!matchesSearch) return false;
                if (currentFilter === 'unread') return chat.unread > 0;
                if (currentFilter === 'group') return chat.type === 'group';
                if (currentFilter === 'secret') return chat.type === 'secret';
                return true;
            });

            if (filteredChats.length === 0) {
                container.innerHTML = `<div class="empty-state">Hech narsa topilmadi.</div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1];

            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender}`;

                let mediaHTML = '';
                if (msg.mediaType === 'image') {
                    mediaHTML = `<div class="message-media"><img src="${msg.mediaUrl}" alt="Rasm"></div>`;
                } else if (msg.mediaType === 'video') {
                    mediaHTML = `<div class="message-media"><video src="${msg.mediaUrl}" controls></video></div>`;
                } else if (msg.mediaType === 'audio') {
                    mediaHTML = `<div class="message-media"><audio src="${msg.mediaUrl}" controls></audio></div>`;
                } else if (msg.mediaType === 'file') {
                    mediaHTML = `<a href="${msg.mediaUrl}" download="${msg.fileName}" class="file-attachment">📄 ${msg.fileName}</a>`;
                }

                const checkMark = msg.sender === 'outgoing' ? '✓✓' : '';

                msgDiv.innerHTML = `
                    ${mediaHTML}
                    ${msg.text ? `<div>${msg.text}</div>` : ''}
                    <div class="message-meta">
                        <span>${msg.time}</span>
                        <span style="color: #0f768a;">${checkMark}</span>

                row.style.display = name.includes(q) ? 'flex' : 'none';

            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === activeChatId);
            chat.messages.push({
                text: text,
                sender: 'outgoing',
                time: getCurrentTime(),
                read: true
            });

            input.value = '';
            saveData();
            renderMessages();
            renderChatList();

            simulateReply(chat);
        }

        function handleFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const fileUrl = URL.createObjectURL(file);
            const chat = chats.find(c => c.id === activeChatId);

            chat.messages.push({
                text: '',
                mediaType: type,
                mediaUrl: fileUrl,
                fileName: file.name,
                sender: 'outgoing',
                time: getCurrentTime(),
                read: true
            });

            event.target.value = '';
            renderMessages();
            renderChatList();
            simulateReply(chat);
        }

                "Juda yaxshi fikr, rahmat 😊",
                "Hozir ko'rib chiqib javob beraman.",
                "Tushunarli, muammo yo'q 👍",
                "Yana savollar bo'lsa bemalol yozaver."
            ];

            setTimeout(() => {
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                chat.messages.push({
                    text: randomReply,
                    sender: 'incoming',
                    time: getCurrentTime(),
                    read: true
                });
                statusEl.innerText = oldStatus;
                saveData();
                if (activeChatId === chat.id) {
                    renderMessages();
                }
                renderChatList();
            }, 1300);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function setFilter(btn, filter) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = filter;
            renderChatList();
        }

        function setNavMenu(btn, filter) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (filter === 'secret') {
                const secretTab = document.querySelector('[data-filter="secret"]');
                setFilter(secretTab, 'secret');
            } else {
                const allTab = document.querySelector('[data-filter="all"]');
                setFilter(allTab, 'all');
            }
        }

        function openNewChatModal() {
            document.getElementById('newChatModal').classList.add('open');
        }

        function openProfileModal() {
            document.getElementById('profileNameInput').value = userProfile.name;
            document.getElementById('profileHandleInput').value = userProfile.handle;
            document.getElementById('profileModal').classList.add('open');
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
        }

        function createNewChat() {
            const name = document.getElementById('newContactName').value.trim();
            const phone = document.getElementById('newContactPhone').value.trim() || "+998 90 000 00 00";
            const username = document.getElementById('newContactUsername').value.trim() || "@" + name.toLowerCase().replace(/\s+/g, '_');
            const type = document.getElementById('newContactType').value;
            if (!name) return;

            const newChat = {
                id: Date.now(),
                name: name,
                status: type === 'group' ? "12 a'zo, 4 onlayn" : (type === 'secret' ? "End-to-end shifrlangan" : "Onlayn"),
                type: type,
                phone: phone,
                username: username.startsWith('@') ? username : '@' + username,
                bio: "Yangi suhbat",
                stats: { photos: 0, videos: 0, files: 0, voice: 0 },
                unread: 0,
                messages: [
                    { text: "Salom! Suhbat boshlandi.", sender: "incoming", time: getCurrentTime(), read: true }
                ]
            };

            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveData();
            closeModals();
            document.getElementById('newContactName').value = '';
            document.getElementById('newContactPhone').value = '';
            document.getElementById('newContactUsername').value = '';
            renderChatList();
            renderMessages();
        }

        function saveProfile() {
            const name = document.getElementById('profileNameInput').value.trim();
            const handle = document.getElementById('profileHandleInput').value.trim();
            if (name) {
                userProfile.name = name;
                userProfile.handle = handle.startsWith('@') ? handle : '@' + handle;
                localStorage.setItem('chatter_user_v4', JSON.stringify(userProfile));
                updateUserUI();
            }
            closeModals();
        }

        function clearCurrentChat() {
            if (confirm("Ushbu chatdagi barcha xabarlarni o'chirmoqchimisiz?")) {
                const chat = chats.find(c => c.id === activeChatId);
                chat.messages = [];
                saveData();
                renderMessages();
                renderChatList();
            }
        }

        function searchInChat() {
            const word = prompt("Suhbat ichidan qaysi so'zni qidiramiz?");
            if (!word) return;
            const chat = chats.find(c => c.id === activeChatId);
            const found = chat.messages.filter(m => m.text && m.text.toLowerCase().includes(word.toLowerCase()));
            alert(`"${word}" so'zi bo'yicha ${found.length} ta xabar topildi.`);
        }

        init();
    </script>
</body>
</html>
